# ─────────────────────────────────────────────────────────────
#  YOUR WATCHLIST
#  Edit this file on GitHub (pencil icon) to add/remove figures.
#  Indentation matters: keep the spaces lined up like the examples.
# ─────────────────────────────────────────────────────────────
#
#  For each figure:
#    name:          what you call it (shown in Discord)
#    search:        words to search for (Japanese works best)
#    jan:           (optional) box barcode – very accurate on Suruga-ya / Rakuten
#    max_price:     (optional) in yen – anything above is ignored
#    must_include:  (optional) words the listing title MUST all contain
#    include_any:   (optional) title must contain AT LEAST ONE of these
#    exclude:       (optional) words that rule a listing out
#    sites:         (optional) only check these: mercari, yahoo, surugaya, rakuten
#
#  Tip: add  max_price: 30000  (for example) under any figure to cap the price.

figures:

  # ── Umineko garage kits ────────────────────────────────────
  # The title has to look like a kit, so keychains, cards etc. are ignored.

  - name: "Eva Beatrice garage kit (Otona no Bijutsushitsu)"   # MFC 288698
    search: "うみねこ ベアトリーチェ"
    include_any: ["ガレージキット", "ガレキ", "キット", "レジン", "ワンフェス", "WF", "未組立"]

  - name: "Lambdadelta garage kit (Model Passiona)"            # MFC 275638
    search: "うみねこ ラムダデルタ"
    include_any: ["ガレージキット", "ガレキ", "キット", "レジン", "ワンフェス", "WF", "未組立"]

  - name: "Bernkastel 1/6 kits (Otona no Bijutsushitsu)"       # MFC 288700 + 288702
    search: "うみねこ ベルンカステル"
    include_any: ["ガレージキット", "ガレキ", "キット", "レジン", "ワンフェス", "WF", "未組立", "1/6"]

  # ── Umineko Dollfie Dreams (Volks) ─────────────────────────

  - name: "Beatrice Dollfie Dream (Volks)"                     # MFC 62293
    search: "ドルフィードリーム ベアトリーチェ"
    jan: "4518992385389"
    exclude: ["衣装のみ", "ウィッグのみ", "アウトフィット"]

  - name: "Maria & Sakutarou Mini Dollfie Dream (Volks)"       # MFC 32588
    search: "うみねこ マリア"
    include_any: ["MDD", "DD", "ドルフィー", "ドール", "ボークス", "VOLKS"]
    exclude: ["衣装のみ", "ウィッグのみ"]

  # ── Sayonara o Oshiete ────────────────────────────────────

  - name: "Sugamo Mutsuki 1/7 (Native)"                        # MFC 331664
    search: "さよならを教えて 睦月"
    include_any: ["フィギュア", "ネイティブ", "Native", "1/7"]

  - name: "Hitomi Hirosuke bust kit (-MU-U-MA-)"               # MFC 2922471
    search: "さよならを教えて 人見"
    include_any: ["ガレージキット", "ガレキ", "キット", "レジン", "ワンフェス", "WF", "トレフェス", "未組立", "バスト"]

  # ── Other figures ─────────────────────────────────────────

  - name: "Yukizuki Sumino 1/8 – Snow (Kotobukiya)"            # MFC 3910
    search: "雪月澄乃"
    jan: "4934054777341"

  - name: "Kneesocks Daemon 1/8 (Alter)"                       # MFC 91353
    search: "ニーソックス アルター"
    jan: "4560228203028"
    must_include: ["ニーソックス"]

  - name: "Scanty Daemon 1/8 (Alter)"                          # MFC 109880
    search: "スキャンティ アルター"
    jan: "4560228203165"
    must_include: ["スキャンティ"]

  - name: "Oshino Shinobu Maidmade 1/7 (Miyuki)"               # MFC 1618604
    search: "忍野忍 メイド"
    jan: "4560369061273"
    include_any: ["1/7", "メイドメイド", "Maidmade", "スケール"]

  - name: "Riina & Saaya 1/6 (F.W.A.T)"                        # MFC 945095
    search: "りぃな さぁや"
    jan: "4573526990026"

  - name: "Minaduki Shigure – Character's Selection (BINDing)" # MFC 2606753
    search: "ネコぱら 時雨"
    include_any: ["BINDing", "バインディング", "キャラクターズセレクション", "ネイティブ", "Native"]


settings:
  # Which sites to check when a figure doesn't list its own.
  # Rakuten is skipped automatically until you add its keys (see README).
  sites: [mercari, yahoo, surugaya, rakuten]

  # Words that rule out a listing for EVERY figure (box only / empty box).
  exclude: ["箱のみ", "空箱", "外箱のみ"]

  # Show an approximate £ price next to the yen price.
  show_gbp: true

  # Seconds to wait between requests (be polite to the sites).
  pause_seconds: 3
