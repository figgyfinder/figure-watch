# ─────────────────────────────────────────────────────────────
#  YOUR WATCHLIST
#  Edit this file on GitHub (pencil icon) to add/remove figures.
#  Indentation matters: keep the spaces lined up like the examples.
# ─────────────────────────────────────────────────────────────
#
#  For each figure:
#    name:          what you call it (shown in Discord)
#    search:        words to search for (Japanese works best)
#    jan:           (optional) box barcode – very accurate on Suruga-ya and Rakuten
#    max_price:     (optional) in yen – anything above is ignored
#    must_include:  (optional) words the listing title MUST all contain.
#                   If left out, every word of `search` must be in the title.
#    include_any:   (optional) title must contain AT LEAST ONE of these.
#                   Several groups [[..],[..]] = one word from EACH group.
#    character:     (optional) words that identify the character, for
#                   "possible match" alerts (defaults to must_include)
#    type:          kit / doll / scale - what kind of item it is
#    scale:         e.g. "1/7" - listings saying a different scale are ignored
#    maker:         the maker/circle - listings naming another maker are ignored
#    version:       e.g. ["メイド"] - outfit version; other outfits are ignored
#    exclude:       (optional) words that rule a listing out
#
#  Exact matches alert normally. Listings with the right character that
#  look like a figure, but don't confirm the maker/version, still alert
#  with a yellow ⚠️ "possible match" warning so nothing gets missed.
#    sites:         (optional) only check these: mercari, yahoo, yahooflea,
#                   rakuma, rakuten, surugaya, mandarake, amiami
#
#  Tip: add  max_price: 30000  (for example) under any figure to cap the price.

figures:

  # ── Umineko garage kits ────────────────────────────────────

  - name: "Eva Beatrice garage kit (Otona no Bijutsushitsu)"   # MFC 288698
    search: "うみねこ ベアトリーチェ"
    type: kit
    maker: ["大人の美術室"]
    must_include: ["ベアトリーチェ"]
    include_any: [["ヱヴァ", "エヴァ", "EVA", "大人の美術室"], ["ガレージキット", "ガレキ", "キット", "レジン", "ワンフェス", "WF", "未組立", "未塗装"]]

  - name: "Lambdadelta garage kit (Model Passiona)"            # MFC 275638
    search: "ラムダデルタ"
    type: kit
    maker: ["パッショナ", "Passiona"]
    include_any: [["パッショナ", "Passiona"], ["ガレージキット", "ガレキ", "キット", "レジン", "ワンフェス", "WF", "未組立", "未塗装"]]

  - name: "Bernkastel 1/6 kits (Otona no Bijutsushitsu)"       # MFC 288700 + 288702
    search: "ベルンカステル"
    type: kit
    scale: "1/6"
    maker: ["大人の美術室"]
    include_any: [["1/6", "大人の美術室"], ["ガレージキット", "ガレキ", "キット", "レジン", "ワンフェス", "WF", "未組立", "未塗装"]]

  # ── Dollfie Dreams (Volks) ─────────────────────────────────

  - name: "Beatrice Dollfie Dream (Volks)"                     # MFC 62293
    search: "ベアトリーチェ ドルフィー"
    type: doll
    maker: ["ボークス", "VOLKS"]
    jan: "4518992385389"
    must_include: ["ベアトリーチェ"]
    include_any: ["DD", "ドルフィー", "Dollfie"]
    exclude: ["衣装のみ", "ウィッグのみ"]

  - name: "Maria & Sakutarou Mini Dollfie Dream (Volks)"       # MFC 32588
    search: "うみねこ マリア"
    type: doll
    maker: ["ボークス", "VOLKS"]
    character: [["マリア", "真里亞", "さくたろ"]]
    must_include: []
    include_any: [["マリア", "真里亞", "さくたろ"], ["MDD", "DD", "ドルフィー", "Dollfie"]]
    exclude: ["衣装のみ", "ウィッグのみ"]

  - name: "Kusugawa Sasara Dollfie Dream (Volks)"              # MFC 13535
    search: "久寿川ささら"
    type: doll
    maker: ["ボークス", "VOLKS"]
    jan: "4518992378565"
    must_include: ["ささら"]
    include_any: ["DD", "ドルフィー", "Dollfie"]
    exclude: ["衣装のみ", "ウィッグのみ"]

  # ── Sayonara o Oshiete ────────────────────────────────────

  - name: "Sugamo Mutsuki 1/7 (Native)"                        # MFC 331664
    # Searches the whole series: sellers often call her 天使様 (the Angel)
    # instead of using her name.
    search: "さよならを教えて"
    jan: "4562271931507"
    character: [["睦月", "巣鴨", "天使"], ["さよならを教えて", "さよ教"]]
    type: scale
    scale: "1/7"
    maker: ["ネイティブ", "Native"]
    must_include: []
    include_any: [["睦月", "巣鴨", "天使"], ["さよならを教えて", "さよ教"], ["フィギュア", "ネイティブ", "Native", "1/7"]]
    exclude: ["ガレージキット", "ガレキ", "レジン", "キット"]

  - name: "Hitomi Hirosuke bust kit (-MU-U-MA-)"               # MFC 2922471
    search: "さよならを教えて"
    type: kit
    character: [["さよならを教えて", "さよ教"]]
    must_include: ["人見"]
    include_any: [["さよならを教えて", "さよ教"], ["ガレージキット", "ガレキ", "キット", "レジン", "ワンフェス", "WF", "トレフェス", "未組立", "バスト"]]

  # ── Scale figures ─────────────────────────────────────────

  - name: "Yukizuki Sumino 1/8 – Snow (Kotobukiya)"            # MFC 3910
    search: "雪月澄乃"
    type: scale
    scale: "1/8"
    maker: ["コトブキヤ", "壽屋", "KOTOBUKIYA"]
    jan: "4934054777341"
    must_include: ["澄乃"]
    include_any: ["コトブキヤ", "壽屋", "KOTOBUKIYA", "1/8"]

  - name: "Kneesocks Daemon 1/8 (Alter)"                       # MFC 91353
