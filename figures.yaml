  - name: "Oshino Shinobu Maidmade 1/7 (Miyuki)"               # MFC 1618604
    search: "忍野忍 メイド"
    version: ["メイド"]
    type: scale
    scale: "1/7"
    maker: ["ミユキ", "Miyuki"]
    character: [["忍野", "しのぶ", "シノブ"], ["メイド"]]
    jan: "4560369061273"
    must_include: ["メイド"]
    include_any: [["忍野", "しのぶ", "シノブ"], ["1/7", "Maidmade", "メイドメイド", "ミユキ", "Miyuki"]]

  - name: "Riina & Saaya 1/6 (F.W.A.T)"                        # MFC 945095
    search: "りぃな さぁや"
    type: scale
    scale: "1/6"
    maker: ["F.W.A.T", "FWAT"]
    jan: "4573526990026"
    include_any: ["F.W.A.T", "FWAT", "1/6"]

  - name: "Minaduki Shigure – Character's Selection (BINDing)" # MFC 2606753
    search: "ネコぱら 時雨"
    type: scale
    maker: ["BINDing", "バインディング", "ネイティブ", "Native"]
    character: [["時雨"], ["ネコぱら", "水無月"]]
    must_include: ["時雨"]
    include_any: ["BINDing", "バインディング", "キャラクターズセレクション", "Character's Selection"]

  - name: "Neko Cafe♡Pantsu (Pink Charm × Henreader)"         # MFC 1471268
    search: "へんりいだ"
    type: scale
    maker: ["Pink Charm", "ピンクチャーム"]
    character: [["へんりいだ", "henreader"]]
    jan: "4582533310086"
    must_include: []
    include_any: [["へんりいだ", "henreader"], ["猫", "ネコ", "ねこ", "neko"], ["カフェ", "cafe"], ["フィギュア", "Pink Charm", "ピンクチャーム", "PinkCharm"]]

  # ── Blue Archive garage kit ───────────────────────────────

  - name: "Shimoe Koharu Gyaru ver. garage kit (Momo+)"       # MFC 2255097
    search: "コハル ギャル"
    type: kit
    maker: ["Momo"]
    character: [["コハル"]]
    must_include: ["コハル"]
    include_any: [["ギャル"], ["ガレージキット", "ガレキ", "キット", "レジン", "ワンフェス", "WF", "未組立", "未塗装", "Momo"]]

  # ── Shizuku (Leaf) garage kits ────────────────────────────

  - name: "Tsukishima Ruriko garage kits (T's System / Corsair)"  # MFC: T's System kit + Corsair MS-DOS ver.
    # Two searches: sellers write 月島瑠璃子 or just 雫 + 瑠璃子
    search: ["月島瑠璃子", "雫 瑠璃子"]
    type: kit
    maker: ["T's System", "ティーズシステム", "Corsair", "コルセア"]
    character: [["瑠璃子", "ルリコ"], ["月島", "雫", "Leaf", "リーフ", "シズク"]]
    must_include: []
    include_any: [["瑠璃子", "ルリコ"], ["T's System", "ティーズシステム", "Corsair", "コルセア"], ["ガレージキット", "ガレキ", "キット", "レジン", "ワンフェス", "WF", "ワンダーフェスティバル", "ホビーフェスティバル", "未組立", "未塗装"]]

settings:
  # Which sites to check when a figure doesn't list its own.
  # Rakuten is skipped automatically until you add its keys (see README).
  sites: [mercari, yahoo, yahooflea, rakuma, rakuten, mandarake, amiami, surugaya]

  # These block GitHub's servers, so they're checked by the home checker on
  # your PC instead (see HOME-SETUP.txt). GitHub skips them.
  home_sites: [amiami, surugaya]

  # Words that rule out a listing for EVERY figure (box only / empty box).
  # (merch that isn't a figure: posters, CDs, books, cards, keyrings...)
  exclude: ["箱のみ", "空箱", "外箱のみ",
            "ポスター", "タペストリー", "ドラマCD", "CD", "DVD", "Blu-ray", "ブルーレイ", "サントラ", "サウンドトラック",
            "漫画", "コミック", "小説", "文庫", "画集", "イラスト集", "アートブック", "ファンブック", "設定資料", "ムック", "同人誌",
            "トレカ", "トレーディングカード", "シングルカード", "遊戯王", "ポケカ", "テレカ", "テレホンカード", "色紙",
            "ポストカード", "イラストカード", "クリアカード", "ブロマイド", "下敷き", "クリアファイル", "缶バッジ", "バッジ",
            "ステッカー", "プレート", "アクスタ", "アクリルスタンド", "アクリルキーホルダー", "キーホルダー", "キーチェーン",
            "ストラップ", "ラバー", "抱き枕", "枕カバー", "クッション", "タオル", "ブランケット", "マウスパッド", "プレイマット",
            "Tシャツ", "パーカー", "トートバッグ", "スマホケース", "ボールペン", "トランプ", "マグカップ", "タンブラー",
            "フィギュアケース", "展示ケース", "コレクションケース", "コスプレ"]

  # @everyone ping for NEWLY LISTED items (restocks / price drops never ping):
  #   exact = only exact matches
  #   all   = exact matches and ⚠️ possible matches
  #   none  = never ping @everyone
  ping_everyone: exact

  # Approximate prices shown next to the yen price (today's exchange rate).
  # Options include GBP, USD, CAD, EUR, AUD. Use [] for yen only.
  currencies: [GBP, USD, CAD]

  # Seconds to wait between requests (be polite to the sites).
  pause_seconds: 2
